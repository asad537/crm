services:
  # PHP-FPM: concurrent request processing (OPcache/JIT via docker/php.ini,
  # worker pool via docker/www.conf). Listens on fastcgi 9000 (internal only).
  app:
    build:
      context: docker
      dockerfile: Dockerfile
    image: crm_l10_php:8.2-fpm
    container_name: crm_l10_app
    working_dir: /var/www
    volumes:
      - .:/var/www:delegated
    depends_on:
      - redis
      - mysql

  # Nginx: serves static files directly (with long cache + gzip) and proxies
  # PHP requests to php-fpm. This is what makes many users concurrent + fast.
  nginx:
    image: nginx:alpine
    container_name: crm_l10_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:delegated
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Scheduler + queue worker (mail sync every minute, queued jobs). Same image as app.
  worker:
    image: crm_l10_php:8.2-fpm
    container_name: crm_l10_worker
    working_dir: /var/www
    # Mail: continuous watch loop (every 3s; idle folders cost one STATUS call) instead of the 1-minute scheduler, plus the queue worker.
    # 7 watcher shards refresh already-synced mailboxes inline every 3s over persistent IMAP
    # connections (one STATUS per folder when idle); first-time backfills are queued and run by
    # 2 queue workers so they never delay the live refresh. Failing mailboxes back off.
    command: >
      sh -c "for i in 0 1 2 3 4 5 6; do php artisan crm:mail-sync --watch --interval=3 --shard=$$i/7 & done;
             php artisan queue:work redis --sleep=1 --tries=2 --timeout=300 --queue=default &
             exec php artisan queue:work redis --sleep=1 --tries=2 --timeout=300 --queue=default"
    volumes:
      - .:/var/www:delegated
    depends_on:
      - app
      - redis
      - mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crm_l10_redis
    ports:
      - "6380:6379"
    volumes:
      - crm_l10_redis:/data

  mysql:
    image: mysql:8.0
    container_name: crm_l10_mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: crm_l10
    # Scale tuning for millions of rows (persisted across restarts):
    #  - buffer_pool 1G: keeps hot data+indexes in RAM (avoids disk reads)
    #  - log_file 256M + flush_at_trx_commit=2: fast bulk writes
    #  - O_DIRECT: skip double OS caching
    command: >
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-connections=200
      --innodb-buffer-pool-instances=4
    volumes:
      - crm_l10_mysql:/var/lib/mysql

volumes:
  crm_l10_redis:
  crm_l10_mysql:
