services:
  # PHP-FPM: concurrent request processing (OPcache/JIT via docker/php.ini,
  # worker pool via docker/www.conf). Listens on fastcgi 9000 (internal only).
  app:
    build:
      context: docker
      dockerfile: Dockerfile
    image: crm_l10_php:8.2-fpm
    container_name: crm_l10_app
    working_dir: /var/www
    volumes:
      - .:/var/www:delegated
    depends_on:
      - redis
      - mysql

  # Nginx: serves static files directly (with long cache + gzip) and proxies
  # PHP requests to php-fpm. This is what makes many users concurrent + fast.
  nginx:
    image: nginx:alpine
    container_name: crm_l10_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:delegated
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: crm_l10_redis
    ports:
      - "6380:6379"
    volumes:
      - crm_l10_redis:/data

  mysql:
    image: mysql:8.0
    container_name: crm_l10_mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: crm_l10
    # Scale tuning for millions of rows (persisted across restarts):
    #  - buffer_pool 1G: keeps hot data+indexes in RAM (avoids disk reads)
    #  - log_file 256M + flush_at_trx_commit=2: fast bulk writes
    #  - O_DIRECT: skip double OS caching
    command: >
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-connections=200
      --innodb-buffer-pool-instances=4
    volumes:
      - crm_l10_mysql:/var/lib/mysql

volumes:
  crm_l10_redis:
  crm_l10_mysql:
