server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    client_max_body_size 200M;

    # gzip static + dynamic text (belt-and-braces with the app's gzip middleware)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # Static assets: let nginx serve them directly (never touches PHP) + long cache.
    # Lead attachments: existing public files are served directly; anything missing falls
    # through to Laravel's authenticated route (new uploads live in storage/app, outside the web root).
    location ^~ /crm_attachments/ {
        location ~* \.(php\d?|phtml|phar)$ { return 404; }
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf|eot|otf|map|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only Laravel's front controller runs as PHP. Any other .php under the web root
    # (an uploaded file, an old editor script) is refused, so nothing uploaded can ever execute.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~* \.(php\d?|phtml|phar)$ {
        return 404;
    }

    # Deny access to hidden/sensitive files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ ^/(\.env|composer\.(json|lock)|artisan)$ {
        deny all;
    }
}
