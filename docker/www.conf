; ── FPM worker pool — concurrency for many simultaneous users ──
[www]
; Dynamic process manager: keep a warm pool, scale up under load.
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; Recycle workers periodically to avoid memory creep.
pm.max_requests = 1000
